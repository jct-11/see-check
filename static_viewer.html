<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingBot-Map 3D Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #1a1a2e; }
  #canvas-container { width: 100vw; height: 100vh; }
  #loading-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: rgba(26,26,46,0.95); color: #eee; font-size: 16px;
    flex-direction: column; gap: 12px;
  }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #progress-bar {
    width: 260px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;
  }
  #progress-fill {
    height: 100%; background: #4fc3f7; border-radius: 3px; transition: width 0.2s; width: 0%;
  }
  #gui-panel {
    position: fixed; top: 10px; right: 10px; width: 280px;
    max-height: calc(100vh - 20px); background: rgba(15,15,30,0.85);
    backdrop-filter: blur(8px); color: #ccc; border-radius: 10px;
    padding: 14px; overflow-y: auto; z-index: 100; font-size: 13px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.3s;
  }
  #gui-panel.hidden { transform: translateX(320px); }
  #gui-toggle {
    position: fixed; top: 14px; right: 300px; z-index: 101;
    background: rgba(15,15,30,0.85); color: #ccc; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px;
    transition: right 0.3s;
  }
  #gui-toggle.shifted { right: 14px; }
  #gui-panel h3 { margin: 0 0 10px 0; color: #4fc3f7; font-size: 15px; }
  .ctrl { margin-bottom: 10px; }
  .ctrl label { display: flex; justify-content: space-between; color: #aaa; font-size: 12px; margin-bottom: 2px; }
  .ctrl label span { color: #4fc3f7; font-weight: bold; }
  .ctrl input[type="range"] { width: 100%; accent-color: #4fc3f7; }
  .ctrl-row { display: flex; gap: 6px; }
  .ctrl-row button { flex: 1; padding: 6px; background: #333; color: #ccc; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .ctrl-row button:hover { background: #444; }
  #info-bar {
    position: fixed; bottom: 10px; left: 10px; color: #888; font-size: 11px; z-index: 100; pointer-events: none;
  }
  #status { color: #4fc3f7; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">Initializing...</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<button id="gui-toggle" title="Toggle panel">☰</button>

<div id="gui-panel">
  <h3>🎯 LingBot-Map 3D Viewer</h3>

  <div class="ctrl">
    <label>Downsample <span id="ds-val">2</span></label>
    <input type="range" id="ds-slider" min="1" max="100" value="2" step="1">
  </div>

  <div class="ctrl">
    <label>Point Size <span id="ps-val">0.002</span></label>
    <input type="range" id="ps-slider" min="0.0005" max="0.02" value="0.002" step="0.0005">
  </div>

  <div class="ctrl">
    <label>Frustum Size <span id="fs-val">0.1</span></label>
    <input type="range" id="fs-slider" min="0.01" max="0.5" value="0.1" step="0.01">
  </div>

  <div class="ctrl">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <input type="checkbox" id="show-cameras" checked style="accent-color:#4fc3f7;">
      Show Camera Frustums
    </label>
  </div>

  <div class="ctrl-row" style="margin-bottom:6px;">
    <button id="btn-reset">Reset View</button>
    <button id="btn-top">Top</button>
    <button id="btn-front">Front</button>
  </div>
</div>

<div id="info-bar">
  Points: <span id="status">-</span> | Frames: <span id="frame-count">-</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const scriptPath = import.meta.url;
const base = new URL('.', new URL(scriptPath, window.location.href)).href;

let scene, camera, renderer, controls;
let cloudGroup, frustumGroup;
let metadata = null;
let camerasData = null;
let combinedPositions = null;
let combinedColors = null;
let pointCloudMesh = null;
let totalLoadedFrames = 0;

const loadingOverlay = document.getElementById('loading-overlay');
const loadingText = document.getElementById('loading-text');
const progressFill = document.getElementById('progress-fill');
const guiPanel = document.getElementById('gui-panel');
const guiToggle = document.getElementById('gui-toggle');

function initScene() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.Fog(0x1a1a2e, 5, 80);

  camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.01, 200);
  camera.position.set(3, 2, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.screenSpacePanning = true;

  const grid = new THREE.GridHelper(20, 20, 0x333355, 0x222244);
  scene.add(grid);

  const axesLen = 1;
  const xAxis = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(axesLen,0,0)]),
    new THREE.LineBasicMaterial({ color: 0xff4444 })
  );
  const yAxis = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,axesLen,0)]),
    new THREE.LineBasicMaterial({ color: 0x44ff44 })
  );
  const zAxis = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,axesLen)]),
    new THREE.LineBasicMaterial({ color: 0x4444ff })
  );
  scene.add(xAxis, yAxis, zAxis);

  cloudGroup = new THREE.Group();
  frustumGroup = new THREE.Group();
  scene.add(cloudGroup);
  scene.add(frustumGroup);

  cloudGroup.scale.set(-1, -1, 1);
  frustumGroup.scale.set(-1, -1, 1);

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
}

async function loadJSON(name) {
  const r = await fetch(base + name);
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
}

async function loadPLY(name) {
  return new Promise((resolve, reject) => {
    new PLYLoader().load(base + name, resolve, undefined, reject);
  });
}

function viridisColor(t) {
  const v = [
    [0.267, 0.004, 0.329], [0.282, 0.141, 0.458], [0.253, 0.265, 0.530],
    [0.206, 0.372, 0.553], [0.163, 0.471, 0.558], [0.128, 0.567, 0.551],
    [0.134, 0.659, 0.517], [0.211, 0.737, 0.448], [0.350, 0.798, 0.346],
    [0.529, 0.836, 0.221], [0.738, 0.847, 0.120], [0.953, 0.827, 0.069],
    [0.993, 0.748, 0.143]
  ];
  const i = Math.min(v.length - 1, Math.floor(t * v.length));
  const c = v[i];
  return new THREE.Color(c[0], c[1], c[2]);
}

function buildFrustums() {
  frustumGroup.clear();
  if (!camerasData) return;

  const frustumScale = parseFloat(document.getElementById('fs-slider').value);
  const S = camerasData.length;

  for (let i = 0; i < S; i++) {
    const cam = camerasData[i];
    if (!cam) continue;
    const Rarr = (cam.R_c2w || cam.R_w2c || []).flat();
    const tarr = cam.t_c2w || cam.t_w2c || [0,0,0];
    if (!Rarr.length) continue;
    const R = new THREE.Matrix3().fromArray(Rarr);
    const t = new THREE.Vector3(tarr[0], tarr[1], tarr[2]);
    const fx = cam.focal[0], fy = cam.focal[1];
    const cx = cam.pp[0], cy = cam.pp[1];
    const W = cam.image_w, H = cam.image_h;
    const s = Math.max(frustumScale * (metadata?.scene_scale || 1), 0.5);

    const cornersCam = [
      new THREE.Vector3((-cx) * s / fx, (-cy) * s / fy, s),
      new THREE.Vector3((W - cx) * s / fx, (-cy) * s / fy, s),
      new THREE.Vector3((W - cx) * s / fx, (H - cy) * s / fy, s),
      new THREE.Vector3((-cx) * s / fx, (H - cy) * s / fy, s),
    ];

    const cornersWorld = cornersCam.map(c => c.applyMatrix3(R).add(t));

    const edges = [
      [t, cornersWorld[0]], [t, cornersWorld[1]], [t, cornersWorld[2]], [t, cornersWorld[3]],
      [cornersWorld[0], cornersWorld[1]], [cornersWorld[1], cornersWorld[2]],
      [cornersWorld[2], cornersWorld[3]], [cornersWorld[3], cornersWorld[0]],
    ];

    const color = viridisColor(i / Math.max(1, S - 1));
    const material = new THREE.LineBasicMaterial({
      color,
      transparent: true,
      opacity: 0.7,
      linewidth: 1,
    });

    const pts = [];
    edges.forEach(([a, b]) => { pts.push(a, b); });
    const geom = new THREE.BufferGeometry().setFromPoints(pts);
    const lines = new THREE.LineSegments(geom, material);
    lines.userData = { frameIdx: i, cameraPos: t.clone() };
    frustumGroup.add(lines);
  }
}

function updateFrustums() {
  buildFrustums();
  frustumGroup.visible = document.getElementById('show-cameras').checked;
}

function rebuildPointCloud() {
  if (!combinedPositions || !combinedColors) return;

  cloudGroup.clear();

  const downsample = parseInt(document.getElementById('ds-slider').value);
  const pointSize = parseFloat(document.getElementById('ps-slider').value);
  const stride = Math.max(1, downsample);

  const totalPoints = combinedPositions.length / 3;
  const dsCount = Math.ceil(totalPoints / stride);
  const dsPos = new Float32Array(dsCount * 3);
  const dsCol = new Float32Array(dsCount * 3);

  for (let i = 0; i < dsCount; i++) {
    const si = i * stride;
    const pIdx = si * 3;
    dsPos[i * 3] = combinedPositions[pIdx];
    dsPos[i * 3 + 1] = combinedPositions[pIdx + 1];
    dsPos[i * 3 + 2] = combinedPositions[pIdx + 2];
    dsCol[i * 3] = combinedColors[pIdx];
    dsCol[i * 3 + 1] = combinedColors[pIdx + 1];
    dsCol[i * 3 + 2] = combinedColors[pIdx + 2];
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(dsPos, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(dsCol, 3));

  const mat = new THREE.PointsMaterial({
    size: pointSize,
    vertexColors: true,
    sizeAttenuation: true,
  });

  pointCloudMesh = new THREE.Points(geom, mat);
  cloudGroup.add(pointCloudMesh);

  document.getElementById('status').textContent = `${dsCount.toLocaleString()} (${totalLoadedFrames} frames)`;
}

function updatePointSize() {
  const pointSize = parseFloat(document.getElementById('ps-slider').value);
  cloudGroup.traverse((child) => {
    if (child.isPoints && child.material) child.material.size = pointSize;
  });
}

function setupGUI() {
  const dsSlider = document.getElementById('ds-slider');
  const psSlider = document.getElementById('ps-slider');
  const fsSlider = document.getElementById('fs-slider');

  dsSlider.addEventListener('input', () => {
    document.getElementById('ds-val').textContent = dsSlider.value;
    rebuildPointCloud();
  });

  psSlider.addEventListener('input', () => {
    document.getElementById('ps-val').textContent = psSlider.value;
    updatePointSize();
  });

  fsSlider.addEventListener('input', () => {
    document.getElementById('fs-val').textContent = fsSlider.value;
    updateFrustums();
  });

  document.getElementById('show-cameras').addEventListener('change', (e) => {
    frustumGroup.visible = e.target.checked;
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    if (metadata?.scene_center) {
      const c = metadata.scene_center;
      controls.target.set(c[0], c[1], c[2]);
    }
    const sc = metadata?.scene_scale || 2;
    camera.position.set(sc * 2, sc * 1.5, sc * 2).add(controls.target);
    controls.update();
  });

  document.getElementById('btn-top').addEventListener('click', () => {
    const sc = metadata?.scene_scale || 2;
    camera.position.copy(controls.target).add(new THREE.Vector3(0, sc * 2, 0.01));
    controls.update();
  });

  document.getElementById('btn-front').addEventListener('click', () => {
    const sc = metadata?.scene_scale || 2;
    camera.position.copy(controls.target).add(new THREE.Vector3(0, 0, sc * 2));
    controls.update();
  });

  guiToggle.addEventListener('click', () => {
    const hidden = guiPanel.classList.toggle('hidden');
    guiToggle.classList.toggle('shifted', hidden);
    guiToggle.textContent = hidden ? '☰' : '✕';
  });
}

async function loadAllFrames(totalFrames) {
  const allPosArrays = [];
  const allColArrays = [];
  let totalPointCount = 0;

  for (let i = 0; i < totalFrames; i++) {
    loadingText.textContent = `Loading frames... ${i + 1}/${totalFrames}`;
    progressFill.style.width = `${((i + 1) / totalFrames) * 100}%`;

    const name = `frame_${String(i).padStart(6, '0')}.ply`;
    try {
      const geom = await loadPLY(name);
      if (!geom || !geom.attributes.position) continue;

      const pos = geom.attributes.position.array;
      const col = geom.attributes.color ? geom.attributes.color.array : null;

      allPosArrays.push(pos);
      if (col) {
        allColArrays.push(col);
      } else {
        const gray = new Float32Array(pos.length);
        gray.fill(0.5);
        allColArrays.push(gray);
      }
      totalPointCount += pos.length / 3;
      totalLoadedFrames++;
    } catch (e) {
      console.warn(`Failed to load frame ${i}:`, e.message);
    }
  }

  if (allPosArrays.length === 0) {
    loadingText.textContent = 'No PLY files found!';
    return;
  }

  loadingText.textContent = `Merging ${totalPointCount.toLocaleString()} points...`;

  combinedPositions = new Float32Array(totalPointCount * 3);
  combinedColors = new Float32Array(totalPointCount * 3);

  let offset = 0;
  for (let i = 0; i < allPosArrays.length; i++) {
    const posArr = allPosArrays[i];
    const colArr = allColArrays[i];
    const n = posArr.length;
    combinedPositions.set(posArr, offset);
    combinedColors.set(colArr, offset);
    offset += n;
  }

  document.getElementById('frame-count').textContent = totalLoadedFrames;

  rebuildPointCloud();
}

async function main() {
  initScene();

  try {
    loadingText.textContent = 'Loading metadata...';
    metadata = await loadJSON('metadata.json');

    const confSlider = document.getElementById('conf-slider');
    if (!confSlider) { /* removed */ }
    const dsSlider = document.getElementById('ds-slider');
    dsSlider.value = metadata.default_downsample || 2;
    document.getElementById('ds-val').textContent = dsSlider.value;

    loadingText.textContent = 'Loading cameras...';
    camerasData = await loadJSON('cameras.json');

    buildFrustums();
    setupGUI();

    await loadAllFrames(metadata.num_frames);

    if (metadata.scene_center) {
      const c = metadata.scene_center;
      controls.target.set(c[0], c[1], c[2]);
      const sc = metadata.scene_scale || 2;
      camera.position.set(c[0] + sc * 2, c[1] + sc * 1.5, c[2] + sc * 2);
      controls.update();
    }

    document.getElementById('status').textContent = 'Ready';

  } catch (e) {
    console.error(e);
    loadingText.textContent = `Error: ${e.message}`;
    return;
  }

  loadingOverlay.style.display = 'none';

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

main().catch((e) => {
  console.error(e);
  loadingText.textContent = `Fatal error: ${e.message}`;
});
</script>
</body>
</html>
